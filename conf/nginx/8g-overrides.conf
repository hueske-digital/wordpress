# Overrides für die 8G Firewall (8g-firewall.conf).
#
# Die 8G-Blockliste ($bad_bot_ng) enthält ab Werk KI-Crawler wie ClaudeBot
# und CCBot. Diese sollen aber crawlen dürfen (Sichtbarkeit in KI-Suchen).
# Statt die Upstream-Datei zu editieren (würde bei jedem 8G-Update verloren
# gehen), wird das Bot-Verdikt hier über eine Allowlist gefiltert.
#
# WICHTIG nach jedem 8G-Update: 8g.conf muss $bad_bot_filtered statt
# $bad_bot_ng prüfen (eine Zeile), sonst greift die Allowlist nicht.

# Nur vollständige Bot-Tokens (Name/Version) matchen, um Spoofing durch
# bloßes Anhängen des Namens zu erschweren. UA-basierte Erkennung bleibt
# grundsätzlich fälschbar – wie die gesamte 8G-Bot-Liste.
map $http_user_agent $allowed_bot_ng {
    default 0;
    "~*claudebot/[0-9]" 1;
    "~*ccbot/[0-9]" 1;
}

# Allowlist gewinnt: nur wenn kein erlaubter Bot matcht, gilt das 8G-Verdikt.
map "$allowed_bot_ng:$bad_bot_ng" $bad_bot_filtered {
    default 0;
    "~^0:[1-9][0-9]*$" 1;
}
