load_module "modules/ngx_http_perl_module.so";

worker_processes auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_accept $webp_suffix {
      default "";
      "~*webp" ".webp";
    }

    # Nur benutzerspezifische Query-Parameter umgehen den FastCGI-Cache.
    # Frueher wurde jeder nicht-leere Query-String gebypasst -- damit lief
    # saemtlicher Kampagnen-Traffic (utm_*, gclid, fbclid) ungecacht in PHP.
    map $query_string $skip_cache_qs {
      default 0;
      "~*(^|&)(s|p|page_id|preview|preview_id|preview_nonce|customize_changeset_uuid|customize_theme|wp_customize|elementor-preview|rest_route|wc-api|wc-ajax|add-to-cart|removed_item|remove_item|download_file|feed|unapproved|moderation-hash|replytocom|nocache|doing_wp_cron|action|_wpnonce)(=|&|$)" 1;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  off;

    sendfile        on;

    server_tokens   off;

    keepalive_timeout  65;

    client_max_body_size 128M;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/8g-firewall.conf;
    include /etc/nginx/conf.d/default.conf;
}
